name: .NET Hello World on Windows

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./HelloWorldApp/HelloWorldApp.csproj

      - name: Build application
        run: dotnet build ./HelloWorldApp/HelloWorldApp.csproj --configuration Release

      - name: Run application
        run: dotnet run --project ./HelloWorldApp/HelloWorldApp.csproj --configuration Release